server:
  port: 8080
  servlet:
    session:
      timeout: 30m
spring:
  application:
    name: "Pialgra-backend"
  datasource:
    driver-class-name: org.postgresql.Driver
    url: "jdbc:postgresql://localhost:5432/pialgradb"
    username: "postgres"
    password: "secret"
  jpa:
    hibernate:
      ddl-auto: update
  session:
    jdbc:
      initialize-schema: always
app:
  session:
    cookie:
      # Set to true once the API is served over HTTPS.
      secure: false
